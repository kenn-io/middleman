          type: string
        repo_path:
          type: string
      required:
        - provider
        - platform_host
        - repo_path
        - owner
        - name
      type: object
    WorkspaceResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/WorkspaceResponse.json
          format: uri
          readOnly: true
          type: string
        agent_state:
          description: Hook-reported aggregate state for live agent sessions. Omitted when no live session has reported lifecycle state.
          enum:
            - idle
            - working
            - input
            - approval
            - done
          type: string
        agent_state_updated_at:
          description: UTC timestamp of the hook report that produced agent_state.
          format: date-time
          type: string
        associated_pr_number:
          format: int64
          type: integer
        branch_upstream_missing:
          description: True when the current branch has an origin upstream configured but its local remote-tracking ref is absent; clients may offer Push so branch sync can verify or create the remote branch.
          type: boolean
        commits_ahead:
          format: int64
          type: integer
        commits_behind:
          format: int64
          type: integer
        created:
          description: True when this response represents a workspace newly created by this request; absent when an existing workspace was returned or on reads.
          type: boolean
        created_at:
          type: string
        enrichment_error:
          description: Combined error from the most recent reconciliation attempt; populated component fields may still contain last-known-good values.
          type: string
        enrichment_refreshed_at:
          description: Oldest successful refresh time across the populated enrichment components.
          type: string
        enrichment_status:
          description: Aggregate git-state and tmux-activity reconciliation status. Failed responses retain last-known-good component fields when available.
          enum:
            - not_applicable
            - pending
            - fresh
            - stale
            - failed
          type: string
        error_message:
          type: string
        git_head_ref:
          type: string
        id:
          type: string
        item_key:
          type: string
        item_last_activity_at:
          type: string
        item_number:
          format: int64
          type: integer
        item_type:
          type: string
        kata:
          $ref: "#/components/schemas/WorkspaceKataMetadata"
        mr_additions:
          format: int64
          type: integer
        mr_ci_status:
          type: string
        mr_deletions:
          format: int64
          type: integer
        mr_head_repo_kind:
          description: "Set only for pull_request workspaces: same_repo when the PR head is confirmed to be in the base repo, fork when it is a confirmed fork clone, unknown when repository identity could not be resolved."
          enum:
            - same_repo
            - fork
            - unknown
          type: string
        mr_is_draft:
          type: boolean
        mr_review_decision:
          type: string
        mr_state:
          type: string
        mr_title:
          type: string
        platform_host:
          type: string
        repo:
          $ref: "#/components/schemas/RepoRefResponse"
        repo_name:
          type: string
        repo_owner:
          type: string
        status:
          type: string
        tmux_activity_source:
          type: string
        tmux_last_output_at:
          type:
            - string
            - "null"
        tmux_pane_title:
          type: string
        tmux_session:
          type: string
        tmux_working:
          type: boolean
        worktree_dirty:
          description: True when the worktree has staged, unstaged, or untracked changes; false when clean; omitted until git-state enrichment completes.
          type: boolean
        worktree_path:
          type: string
      required:
        - id
        - repo
        - platform_host
        - repo_owner
        - repo_name
        - item_type
        - item_number
        - item_key
        - git_head_ref
        - worktree_path
        - tmux_session
        - tmux_working
        - tmux_activity_source
        - tmux_last_output_at
        - status
        - created_at
        - enrichment_status
      type: object
    WorkspaceRuntimeResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/schemas/WorkspaceRuntimeResponse.json
          format: uri
