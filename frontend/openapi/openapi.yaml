      type: object
    WorkspaceSettingsUpdate:
      additionalProperties: false
      properties:
        auto_assign_on_create:
          type: boolean
        default_sidebar_view:
          enum:
            - diff
            - item
          type: string
      type: object
    WorkspaceSummary:
      additionalProperties: false
      properties:
        agent_state:
          type: string
        agent_state_updated_at:
          type: string
        associated_pr_number:
          format: int64
          type: integer
        branch_upstream_missing:
          type: boolean
        commits_ahead:
          format: int64
          type: integer
        commits_behind:
          format: int64
          type: integer
        created_at:
          type: string
        enrichment_error:
          type: string
        enrichment_refreshed_at:
          type: string
        enrichment_status:
          type: string
        error_message:
          type: string
        fleet_host_key:
          type: string
        fleet_host_name:
          type: string
        git_head_ref:
          type: string
        id:
          type: string
        item_key:
          type: string
        item_last_activity_at:
          type: string
        item_number:
          format: int64
          type: integer
        item_type:
          type: string
        kata:
          $ref: "#/components/schemas/WorkspaceKataSummary"
        mr_additions:
          format: int64
          type: integer
        mr_ci_status:
          type: string
        mr_deletions:
          format: int64
          type: integer
        mr_is_draft:
          type: boolean
        mr_review_decision:
          type: string
        mr_state:
          type: string
        mr_title:
          type: string
        platform_host:
          type: string
        repo:
          $ref: "#/components/schemas/WorkspaceRepositorySummary"
        repo_name:
          type: string
        repo_owner:
