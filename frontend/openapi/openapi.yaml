info:
  title: kenn-forge API
  version: 0.1.0
openapi: 3.1.0
paths:
  /activity:
    get:
      operationId: list-activity
      parameters:
        - description: Repository filter. Accepts provider|platform_host/repo_path, with comma-separated values for multiple repositories.
          explode: false
          in: query
          name: repo
          schema:
            description: Repository filter. Accepts provider|platform_host/repo_path, with comma-separated values for multiple repositories.
            type: string
        - explode: false
          in: query
          name: types
          schema:
            items:
              type: string
            type: array
        - description: "Item scopes included before limiting activity results: pr, issue, or repo."
          explode: false
          in: query
          name: item_types
          schema:
            description: "Item scopes included before limiting activity results: pr, issue, or repo."
            items:
              type: string
            type: array
        - explode: false
          in: query
          name: search
          schema:
            type: string
        - description: Exact, case-insensitive pull request or issue author filter.
          explode: false
          in: query
          name: author
          schema:
            description: Exact, case-insensitive pull request or issue author filter.
            type: string
        - description: Only include activity for pull requests and issues involving the authenticated viewer.
          explode: false
          in: query
          name: involves_me
          schema:
            description: Only include activity for pull requests and issues involving the authenticated viewer.
            type: boolean
        - description: Only include activity for pull requests and issues with no assignees.
          explode: false
          in: query
          name: unassigned
          schema:
            description: Only include activity for pull requests and issues with no assignees.
            type: boolean
        - explode: false
          in: query
          name: after
          schema:
            type: string
        - explode: false
          in: query
          name: before
          schema:
            type: string
        - explode: false
          in: query
          name: at_or_before
          schema:
            type: string
        - explode: false
          in: query
          name: since
          schema:
            type: string
        - explode: false
          in: query
          name: projection
          schema:
            default: full
            enum:
              - full
              - collapsed
              - events
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 500
            minimum: 10
            type: integer
        - explode: false
          in: query
          name: hide_closed_merged
          schema:
            type: boolean
        - explode: false
          in: query
          name: hide_bots
          schema:
            type: boolean
        - explode: false
          in: query
          name: hide_default_branch
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: List activity
      tags:
        - Activity
  /activity/authors:
    get:
      operationId: list-activity-authors
      parameters:
        - description: Repository filter. Accepts provider|platform_host/repo_path, with comma-separated values for multiple repositories.
          explode: false
          in: query
          name: repo
          schema:
            description: Repository filter. Accepts provider|platform_host/repo_path, with comma-separated values for multiple repositories.
            type: string
        - explode: false
          in: query
          name: since
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityAuthorsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: List activity authors
      tags:
        - Activity
  /activity/thread-events:
    get:
      operationId: list-activity-thread-events
      parameters:
        - explode: false
          in: query
          name: provider
          schema:
            type: string
        - explode: false
          in: query
          name: platform_host
          schema:
            type: string
        - explode: false
          in: query
          name: platform_repo_id
          schema:
            type: string
        - explode: false
          in: query
          name: item_type
          schema:
            enum:
              - pr
              - issue
            type: string
        - explode: false
          in: query
          name: item_number
          schema:
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: types
          schema:
            items:
              type: string
            type: array
        - explode: false
          in: query
          name: search
          schema:
            type: string
        - description: Only include activity for pull requests and issues with no assignees.
          explode: false
          in: query
          name: unassigned
          schema:
            description: Only include activity for pull requests and issues with no assignees.
            type: boolean
        - explode: false
          in: query
          name: since
          schema:
            type: string
        - explode: false
          in: query
          name: before
          schema:
            type: string
        - explode: false
          in: query
          name: at_or_before
          schema:
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 100
            format: int64
            maximum: 250
            minimum: 10
            type: integer
        - explode: false
          in: query
          name: hide_closed_merged
          schema:
            type: boolean
        - explode: false
          in: query
          name: hide_bots
          schema:
            type: boolean
        - explode: false
          in: query
          name: hide_default_branch
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: List activity thread events
      tags:
        - Activity
  /agent-hooks/{agent}:
    post:
      operationId: receive-agent-hook
      parameters:
        - in: path
          name: agent
          required: true
          schema:
            type: string
        - in: header
          name: X-Kenn-Forge-Runtime-Session-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookEvent"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentHookResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Receive agent lifecycle hook
      tags:
        - Activity
  /archive/pacing:
    get:
      operationId: list-archive-pacing
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ArchivePacingStatusResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: List archive hydration pacing per provider credential
      tags:
        - Archive
  /archive/pause:
    post:
      operationId: pause-archives
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveMutationBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ArchiveStatusResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Pause historical archives
      tags:
        - Archive
  /archive/report:
    get:
      operationId: get-archive-report
      parameters:
        - description: Inclusive UTC RFC3339 boundary.
          explode: false
          in: query
          name: start
          required: true
          schema:
            description: Inclusive UTC RFC3339 boundary.
            type: string
        - description: Exclusive UTC RFC3339 boundary.
          explode: false
          in: query
          name: end
          required: true
          schema:
            description: Exclusive UTC RFC3339 boundary.
            type: string
        - description: Repeated provider|platform_host/repo_path filters.
          explode: true
          in: query
          name: repo
          schema:
            description: Repeated provider|platform_host/repo_path filters.
            items:
              type: string
            type: array
        - explode: false
          in: query
          name: verbose
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveReportResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Get historical archive activity report
      tags:
        - Archive
  /archive/start:
    post:
      operationId: start-archives
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveMutationBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ArchiveStatusResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Start historical archives
      tags:
        - Archive
  /archive/status:
    get:
      operationId: list-archive-status
      parameters:
        - description: Repeated provider|platform_host/repo_path filters.
          explode: true
          in: query
          name: repo
          schema:
            description: Repeated provider|platform_host/repo_path filters.
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ArchiveStatusResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: List historical archive status
      tags:
        - Archive
  /docs/browse:
    get:
      operationId: browse-docs-folders
      parameters:
        - explode: false
          in: query
          name: path
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocsBrowseOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Browse docs folders
      tags:
        - Docs
  /docs/folders:
    get:
      operationId: list-docs-folders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDocsFoldersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: List docs folders
      tags:
        - Docs
    post:
      operationId: create-docs-folder
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocsFolderInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDocsFolderOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Create docs folder
      tags:
        - Docs
  /docs/folders/{id}:
    delete:
      operationId: delete-docs-folder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Delete docs folder
      tags:
        - Docs
    patch:
      operationId: update-docs-folder
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
