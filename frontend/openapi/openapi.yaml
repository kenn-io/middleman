        pull:
          $ref: "#/components/schemas/WorkspaceLaunchPull"
        repository:
          $ref: "#/components/schemas/WorkspaceLaunchRepository"
        source_title:
          type: string
        source_url:
          type: string
        source_visible:
          type: boolean
        source_visible_until:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - version
        - repository
        - item_type
        - item_number
        - item_key
        - git_head_ref
        - source_title
        - source_url
        - source_visible
        - source_visible_until
        - issued_at
      type: object
    WorkspaceRef:
      additionalProperties: false
      properties:
        id:
          type: string
        status:
          type: string
      required:
        - id
        - status
      type: object
    WorkspaceRepositorySummary:
      additionalProperties: false
      properties:
        name:
          type: string
